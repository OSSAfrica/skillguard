name: CI

on:
  push:
    branches: [ main, release ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e #v7.0.0
        with:
          go-version: '1.25'
          cache: true

      - name: Run tests
        run: go test -v -race -cover ./...

      - name: Test reference harness gate
        run: |
          go build -o "$RUNNER_TEMP/skillguard-harness-test" .
          SKILLGUARD_TEST_SCANNER="$RUNNER_TEMP/skillguard-harness-test" python3 -I -m unittest discover -s examples/harness -p 'test_*.py' -v
          SKILLGUARD_TEST_SCANNER="$RUNNER_TEMP/skillguard-harness-test" python3 -I -m unittest discover -s integrations/clients -p 'test_*.py' -v

      - name: Test OpenCode quarantine plugin
        run: node --test integrations/clients/opencode-plugin/test.mjs

      - name: Test native plugin runtime and packaging
        run: |
          python3 -I -m unittest discover -s integrations/plugins -p 'test_*.py' -v
          node --test integrations/plugins/test_opencode.mjs

      - name: Run lint
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          args: --timeout=5m

      - name: Run gosec
        uses: securego/gosec@5eb1d104ef85ff2c905c877eb600e8c1dee33a22 # v2.30.0
        with:
          args: -exclude-generated -exclude-dir=examples ./...

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e #v7.0.0
        with:
          go-version: '1.25'
          cache: true

      - name: Build
        run: go build -o skillguard .

      - name: Verify build
        run: |
          ./skillguard --version
          ./skillguard scan --help
