# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow checks out code, builds an image, performs a container image
# scan with Anchore's Syft tool, and uploads the results to the GitHub Dependency
# submission API.

# For more information on the Anchore sbom-action usage
# and parameters, see https://github.com/anchore/sbom-action. For more
# information about the Anchore SBOM tool, Syft, see
# https://github.com/anchore/syft
name: Anchore Syft SBOM scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/workflows/anchore-syft.yml'
      - '.dockerignore'
      - 'Dockerfile'
      - 'go.mod'
      - 'go.sum'
      - '**/*.go'

permissions:
  contents: read

jobs:
  Anchore-Build-Scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag localbuild/testimage:latest
      - name: Scan the image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          image: "localbuild/testimage:latest"
          artifact-name: skillguard
          output-file: skillguard.spdx.json
          upload-release-assets: false

      - name: Generate dependency snapshot
        run: syft scan docker:localbuild/testimage:latest -o github=dependency-snapshot.json

      - name: Upload dependency snapshot artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skillguard-dependency-snapshot
          path: dependency-snapshot.json
          if-no-files-found: error
          retention-days: 5

  submit-dependencies:
    needs: Anchore-Build-Scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # required by the Dependency submission API
    steps:
      # Consume data from this run without checking out or building repository code.
      - name: Download dependency snapshot
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: skillguard-dependency-snapshot
          path: ${{ runner.temp }}/dependency-snapshot

      - name: Bind snapshot to this workflow run
        env:
          SNAPSHOT_SHA: ${{ github.sha }}
          SNAPSHOT_REF: ${{ github.ref }}
          SNAPSHOT_RUN_ID: ${{ github.run_id }}
          # Preserve the previous producer's correlator so new snapshots replace it.
          SNAPSHOT_CORRELATOR: ${{ github.workflow }}_Anchore-Build-Scan_skillguard
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "dependency-snapshot" / "dependency-snapshot.json"
          snapshot = json.loads(path.read_text())
          snapshot["sha"] = os.environ["SNAPSHOT_SHA"]
          snapshot["ref"] = os.environ["SNAPSHOT_REF"]
          snapshot["job"] = {
              "id": os.environ["SNAPSHOT_RUN_ID"],
              "correlator": os.environ["SNAPSHOT_CORRELATOR"],
          }
          path.write_text(json.dumps(snapshot))
          PY

      - name: Submit dependency snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dependency-graph/snapshots" \
            --input "${RUNNER_TEMP}/dependency-snapshot/dependency-snapshot.json"
