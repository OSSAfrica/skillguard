name: Action CI

on:
  push:
    branches: [main]
    paths:
      - 'action.yml'
      - '.github/workflows/action-ci.yml'
  pull_request:
    paths:
      - 'action.yml'
      - '.github/workflows/action-ci.yml'
permissions:
  contents: read

jobs:
  test-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - name: Test action with default inputs
        id: default
        uses: ./
        with:
          path: '.'
          threshold: 70
        continue-on-error: true

      - name: Test action with JSON output
        id: with-output
        uses: ./
        with:
          path: '.'
          threshold: 70
          output: 'test-report.json'
          verbose: true
        continue-on-error: true

      - name: Test action with a path that cannot be scanned
        id: missing-path
        uses: ./
        with:
          path: 'does-not-exist'
          threshold: 70
        continue-on-error: true

      - name: Verify outputs are set
        env:
          DEFAULT_RESULT: ${{ steps.default.outputs.result }}
          DEFAULT_TOTAL: ${{ steps.default.outputs.total_skills }}
          DEFAULT_PASSED: ${{ steps.default.outputs.passed_count }}
          DEFAULT_FAILED: ${{ steps.default.outputs.failed_count }}
          DEFAULT_REPORT: ${{ steps.default.outputs.report_path }}
          OUTPUT_RESULT: ${{ steps.with-output.outputs.result }}
          OUTPUT_TOTAL: ${{ steps.with-output.outputs.total_skills }}
          OUTPUT_PASSED: ${{ steps.with-output.outputs.passed_count }}
          OUTPUT_FAILED: ${{ steps.with-output.outputs.failed_count }}
          OUTPUT_REPORT: ${{ steps.with-output.outputs.report_path }}
          MISSING_RESULT: ${{ steps.missing-path.outputs.result }}
          MISSING_TOTAL: ${{ steps.missing-path.outputs.total_skills }}
        run: |
          echo "Default run: result=${DEFAULT_RESULT} total=${DEFAULT_TOTAL} passed=${DEFAULT_PASSED} failed=${DEFAULT_FAILED}"
          echo "Output run:  result=${OUTPUT_RESULT} total=${OUTPUT_TOTAL} passed=${OUTPUT_PASSED} failed=${OUTPUT_FAILED}"
          echo "Report path: ${OUTPUT_REPORT}"
          echo "Missing run: result=${MISSING_RESULT} total=${MISSING_TOTAL}"

          fail() {
            echo "ERROR: $1"
            exit 1
          }

          [[ -n "${OUTPUT_RESULT}" ]] || fail "result output was not set"
          [[ -n "${DEFAULT_RESULT}" ]] || fail "result output was not set without output"
          [[ "${DEFAULT_TOTAL}" -gt 0 ]] || fail "total_skills must be counted without output"
          [[ "${DEFAULT_TOTAL}" == "${OUTPUT_TOTAL}" ]] || fail "total_skills differs between runs"
          [[ "${DEFAULT_PASSED}" == "${OUTPUT_PASSED}" ]] || fail "passed_count differs between runs"
          [[ "${DEFAULT_FAILED}" == "${OUTPUT_FAILED}" ]] || fail "failed_count differs between runs"
          [[ -z "${DEFAULT_REPORT}" ]] || fail "report_path must be empty without output"
          [[ "${OUTPUT_REPORT}" == "test-report.json" ]] || fail "report_path was not set"
          [[ -f test-report.json ]] || fail "report was not copied to the workspace"
          [[ "${MISSING_RESULT}" == "error" ]] || fail "a scan that cannot run must report result=error"
          [[ "${MISSING_TOTAL}" == "0" ]] || fail "total_skills must be 0 without a report"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: action-test-report
          path: test-report.json
          if-no-files-found: ignore
