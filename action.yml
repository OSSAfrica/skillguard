name: 'SkillGuard'
description: 'Security scanner for AI agent skill definitions — detects vulnerabilities, dangerous permissions, and supply chain risks'
author: 'OSSAfrica'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  path:
    description: 'Path to scan (file, directory, or comma-separated paths)'
    required: false
    default: '.'
  threshold:
    description: 'Minimum score to pass (0-100)'
    required: false
    default: '70'
  output:
    description: 'Output JSON report to file'
    required: false
    default: ''
  quiet:
    description: 'Minimal output - just pass/fail'
    required: false
    default: 'false'
  verbose:
    description: 'Show all findings and detailed breakdown'
    required: false
    default: 'false'
  version:
    description: 'SkillGuard image tag or digest to run (e.g. v1.2.3, or sha256:...). Pin this for reproducible scans.'
    required: false
    default: 'latest'

outputs:
  result:
    description: 'Overall scan result: passed, failed, or error if the scan could not complete'
    value: ${{ steps.scan.outputs.result }}
  total_skills:
    description: 'Number of skills scanned'
    value: ${{ steps.scan.outputs.total_skills }}
  passed_count:
    description: 'Number of skills that passed'
    value: ${{ steps.scan.outputs.passed_count }}
  failed_count:
    description: 'Number of skills that failed'
    value: ${{ steps.scan.outputs.failed_count }}
  report_path:
    description: 'Path to the JSON report file (if output was specified)'
    value: ${{ steps.scan.outputs.report_path }}

runs:
  using: 'composite'
  steps:
    - name: Run SkillGuard scan
      id: scan
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_THRESHOLD: ${{ inputs.threshold }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_QUIET: ${{ inputs.quiet }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        # Pull the SkillGuard image. A digest (sha256:...) pins exactly;
        # a tag such as v1.2.3 pins to a released version.
        if [[ "${INPUT_VERSION}" == sha256:* ]]; then
          IMAGE="ghcr.io/ossafrica/skillguard@${INPUT_VERSION}"
        else
          IMAGE="ghcr.io/ossafrica/skillguard:${INPUT_VERSION}"
        fi
        docker pull "${IMAGE}"

        # Create a temporary directory for container output
        TEMP_DIR=$(mktemp -d)
        CONTAINER_OUTPUT="${TEMP_DIR}/skillguard-report.json"

        # Always write the report to the temp directory: the outputs and job
        # summary need it even when the output input is not set. The report is
        # only readable by its owner, so the container runs as the runner user.
        set +e
        docker run --rm \
          -v "${GITHUB_WORKSPACE}:/workspace" \
          -v "${TEMP_DIR}:/tmp" \
          -w /workspace \
          --user "$(id -u):$(id -g)" \
          "${IMAGE}" \
          scan \
          --path "${INPUT_PATH}" \
          --threshold "${INPUT_THRESHOLD}" \
          --output "/tmp/skillguard-report.json" \
          $( [[ "${INPUT_QUIET}" == "true" ]] && echo "--quiet" ) \
          $( [[ "${INPUT_VERBOSE}" == "true" ]] && echo "--verbose" )
        EXIT_CODE=$?

        # 0 is a pass and 1 is a failed scan. Anything else means the scan did
        # not complete, which must not read as skills failing the threshold.
        case "${EXIT_CODE}" in
          0) RESULT="passed" ;;
          1) RESULT="failed" ;;
          *) RESULT="error" ;;
        esac
        echo "result=${RESULT}" >> "${GITHUB_OUTPUT}"

        if [[ -f "${CONTAINER_OUTPUT}" ]]; then
          # Check for nulls
          TOTAL=$(jq -r '.total_skills // 0' "${CONTAINER_OUTPUT}" || echo "0")
          PASSED=$(jq -r '.passed // 0' "${CONTAINER_OUTPUT}" || echo "0")
          FAILED=$(jq -r '.failed // 0' "${CONTAINER_OUTPUT}" || echo "0")
        
          echo "total_skills=${TOTAL}" >> "${GITHUB_OUTPUT}"
          echo "passed_count=${PASSED}" >> "${GITHUB_OUTPUT}"
          echo "failed_count=${FAILED}" >> "${GITHUB_OUTPUT}"

          # Copy the report from temp directory to workspace if output was specified
          if [[ -n "${INPUT_OUTPUT}" ]]; then
            # Ensure destination directory exists
            mkdir -p "$(dirname "${GITHUB_WORKSPACE}/${INPUT_OUTPUT}")"
            cp "${CONTAINER_OUTPUT}" "${GITHUB_WORKSPACE}/${INPUT_OUTPUT}"
            echo "report_path=${INPUT_OUTPUT}" >> "${GITHUB_OUTPUT}"
          else
            echo "report_path=" >> "${GITHUB_OUTPUT}"
          fi
          
          # Generate GitHub job summary markdown table
          if [[ -f "${TEMP_DIR}/skillguard-report.json" ]]; then
            echo "## SkillGuard Security Scan Results" >> "${GITHUB_STEP_SUMMARY}"
            echo "" >> "${GITHUB_STEP_SUMMARY}"
            echo "| Skill | Score | Pass/Fail | Critical Count |" >> "${GITHUB_STEP_SUMMARY}"
            echo "|-------|-------|-----------|----------------|" >> "${GITHUB_STEP_SUMMARY}"
            
            # Extract each skill result and format as markdown table row
            jq -r '.results[] | "| \(.skill_name) | \(.overall_score)/100 | \(if .passed then "✅ PASS" else "❌ FAIL" end) | \(.critical_count) |"' "${TEMP_DIR}/skillguard-report.json" >> "${GITHUB_STEP_SUMMARY}" 2>/dev/null || true
            
            echo "" >> "${GITHUB_STEP_SUMMARY}"
            echo "**Summary:** ${PASSED} passed, ${FAILED} failed out of ${TOTAL} total skills (threshold: ${INPUT_THRESHOLD})" >> "${GITHUB_STEP_SUMMARY}"

            if [[ "${RESULT}" == "error" ]]; then
              echo "" >> "${GITHUB_STEP_SUMMARY}"
              echo "⚠️ **Scan Incomplete** - Not all inputs were analyzed; see coverage_gaps in the report" >> "${GITHUB_STEP_SUMMARY}"
            fi

            if [[ ${FAILED} -gt 0 ]]; then
              echo "" >> "${GITHUB_STEP_SUMMARY}"
              echo "### Failed Skills Details" >> "${GITHUB_STEP_SUMMARY}"
              jq -r '.results[] | select(.passed == false) | "- **\(.skill_name)** (Score: \(.overall_score)/100, Critical: \(.critical_count), File: \(.file_path))"' "${TEMP_DIR}/skillguard-report.json" >> "${GITHUB_STEP_SUMMARY}" 2>/dev/null || true
            fi
          fi
        else
          # Set defaults
          echo "total_skills=0" >> "${GITHUB_OUTPUT}"
          echo "passed_count=0" >> "${GITHUB_OUTPUT}"
          echo "failed_count=0" >> "${GITHUB_OUTPUT}"
          echo "report_path=" >> "${GITHUB_OUTPUT}"
          
          # Write basic summary when the scan produced no report
          echo "## SkillGuard Security Scan Results" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${RESULT}" == "passed" ]]; then
            echo "✅ **Scan Passed** - All skills meet the threshold of ${INPUT_THRESHOLD}" >> "${GITHUB_STEP_SUMMARY}"
          elif [[ "${RESULT}" == "failed" ]]; then
            echo "❌ **Scan Failed** - One or more skills below threshold of ${INPUT_THRESHOLD}" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "⚠️ **Scan Error** - The scan did not complete (exit code ${EXIT_CODE})" >> "${GITHUB_STEP_SUMMARY}"
          fi
        fi
        
        # Clean up
        rm -rf "${TEMP_DIR}"
        exit ${EXIT_CODE}
